:root{--bg:#07080b;--s1:#101218;--s2:#171a22;--s3:#1f232d;--line:rgba(255,255,255,.08);--tx:#f4f6fa;--t2:#d5d9e2;--mute:#a3abba;--ac:#7cc4ff;--ac2:#b4e3ff;--ok:#5fe3a1;--tbg:rgba(23,26,34,.92);
--f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fl:var(--f);--fk:'Rabar',Tahoma,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--tx);font-family:var(--f);line-height:1.6;background:radial-gradient(900px 420px at 50% -120px,rgba(124,196,255,.16),transparent 70%),var(--bg);min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px 16px 130px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;transition:transform .12s,background .2s,border-color .2s}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
svg{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{flex:none;width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--ac),var(--ac2));color:#06121f;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 8px 24px rgba(124,196,255,.3)}
h1{font-size:1.2rem;white-space:nowrap;line-height:1.2;margin:0}
.tag{color:var(--mute);font-size:.82rem;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:20px;background:var(--s1);border:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg button{padding:9px 4px;border-radius:15px;color:var(--mute);font-size:1.02rem;line-height:1.25;font-weight:600}
.seg button small{display:block;font-size:.66rem;opacity:.9;font-weight:500}
.seg button[aria-selected="true"]{background:linear-gradient(145deg,var(--ac),var(--ac2));color:#06121f;box-shadow:0 6px 18px rgba(124,196,255,.28)}
.hero{margin:22px 2px 16px}
.hero h2{font-size:1.8rem;line-height:1.25;margin:0}
.hero p{color:var(--mute);font-size:.85rem;margin:2px 0 0}
.note{display:flex;gap:10px;align-items:center;font-size:.86rem;color:var(--t2);background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin:0 0 14px}
.note svg{flex:none;font-size:1.2rem;color:var(--ac)}
.ex{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:26px;padding:16px;margin-bottom:18px;transition:border-color .3s,box-shadow .3s}
.ex.done{border-color:rgba(95,227,161,.5);box-shadow:0 0 0 1px rgba(95,227,161,.15),0 12px 36px rgba(95,227,161,.08)}
.hd{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:52px;height:52px;border-radius:17px;background:var(--s3);color:var(--ac2);font-size:1.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line)}
.ex.done .num{background:var(--ok);color:#052214}
.nm{flex:1;min-width:0}
.nm h3{font-size:1.35rem;line-height:1.25;margin:2px 0 4px;font-weight:800;letter-spacing:-.01em}
.sec{display:flex;flex-wrap:wrap;gap:0 12px;font-size:.78rem;color:var(--mute)}
.sec span{unicode-bidi:plaintext}
.sec span:first-child{font-family:var(--fk);font-size:.85rem}
.frame{width:204px;max-width:100%;margin:16px auto 0;padding:2.5px;border-radius:30px;background:linear-gradient(160deg,var(--ac),#a9c4ff 50%,#7a8cff);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 30px rgba(124,196,255,.22)}
.vid{position:relative;background:#000;aspect-ratio:9/16;border-radius:28px;overflow:hidden}
.vid iframe{width:100%;height:100%;border:0;display:block}
.none{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:#7a8190;font-size:.9rem}
.none svg{font-size:2.2rem}
.lbl{color:var(--mute);font-size:.76rem;margin:18px 2px 8px;font-weight:500}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.set{position:relative;padding:10px 4px 9px;border-radius:18px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.set small{display:block;font-size:.68rem;color:var(--mute);line-height:1.4}
.set b{display:block;font-size:1.6rem;line-height:1.15;font-weight:700}
.set.on{background:linear-gradient(145deg,var(--ok),#9af0c4);color:#052214;box-shadow:none}
.set.on small{color:#0b5a35}
.set.on::after{content:"";position:absolute;top:7px;right:8px;width:7px;height:12px;border:solid #052214;border-width:0 2.5px 2.5px 0;transform:rotate(40deg) scale(.8)}
.row{display:flex;gap:10px;align-items:stretch}
.step{flex:1;display:flex;align-items:center;justify-content:space-between;border-radius:18px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line);padding:4px}
.step button{width:42px;height:42px;border-radius:14px;background:var(--s2);font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.step label{flex:1;text-align:center;display:block}
.step input{width:100%;min-width:0;background:none;border:0;color:var(--tx);font-family:var(--f);font-size:1.4rem;font-weight:700;text-align:center;padding:0;line-height:1.1}
.step input::placeholder{color:#7a8190}
.step em{display:block;font-style:normal;font-size:.66rem;color:var(--mute)}
.rest{flex:none;display:flex;gap:8px}

function nextDay(){var h=jget('g:hist',[]);if(!h.length)return 0;var d=h[h.length-1].day,n=DAYS.length;for(var i=1;i<=n;i++){var j=(d+i)%n;if(DAYS[j].ex.length)return j}return 0}
function weekStrip(){var h=jget('g:hist',[]),now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow).getTime(),c=0,t='';
 for(var i=0;i<7;i++){var a=mon+i*864e5,b=a+864e5,did=h.some(function(x){return x.t>=a&&x.t<b});if(did)c++;t+='<span class="wd'+(did?' on':'')+(i===dow?' td':'')+'">'+'MTWTFSS'[i]+'</span>'}
 return '<div class="wkr">'+t+'<em>'+c+' this week</em></div>'}
/* ---------- HOME ---------- */
var tx0=0,ty0=0;
document.addEventListener('touchstart',function(e){tx0=e.touches[0].clientX;ty0=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){if(!document.body.classList.contains('wk'))return;var t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;if(Math.abs(dx)>80&&Math.abs(dy)<45){var b=document.getElementById(dx<0?'nx':'pv');if(b&&!b.disabled&&!(dx<0&&b.textContent.indexOf('Finish')>-1))b.click()}},{passive:true});
function home(){
  wake(false);document.body.classList.remove("wk");
  var d=DAYS[sel],h='<div class="top"><div class="logo">'+I.dumb+'</div><div class="tt"><h1>Workout Plan</h1></div><div class="kd" dir="rtl"><b>بەرنامەی تەمرین</b><span>تایبەت بە کاک لوقمان</span></div><button class="ib" id="hb" aria-label="History">'+I.hist+'</button></div>';
  h+=weekStrip()+'<div class="seg" role="tablist">'+DAYS.map(function(x,i){return '<button role="tab" data-i="'+i+'" aria-selected="'+(i===sel)+'">Day '+(i+1)+(x.title?'<small>'+x.title+'</small>':'')+'</button>'}).join("")+'</div>';
  if(!d.ex.length){h+='<div class="empty">'+I.dumb+'Day '+(sel+1)+' is not added yet</div>'}
  else{
    var res=cur&&cur.day===sel;
    h+='<div class="hero"><h2>'+d.title+'</h2><p>'+(jget('g:hist',[]).length&&sel===nextDay()?'Up next · ':'')+d.ex.length+' exercises · about '+Math.round(d.ex.length*5.5)+' min</p></div>';
    if(d.warm)h+='<div class="note" dir="rtl">'+I.fire+'<span>'+d.warm+'</span></div>';
    h+=d.ex.map(function(e,k){return '<div class="li">'+(e.img?'<span class="th" style="background-image:url('+e.img+')"><i>'+(k+1)+'</i></span>':'<span class="ln">'+(k+1)+'</span>')+'<div><b>'+e.en+'</b><small>'+reps(e)+'</small></div></div>'}).join("");
    h+='<div class="cta"><div class="cin"><button class="b1" id="go">'+(res?'Resume · exercise '+(cur.idx+1)+' of '+d.ex.length:'Start Workout')+I.play+'</button>'+(res?'<button class="lk" id="so">Start over</button>':'')+'</div></div>';
  }
  app.innerHTML=h;window.scrollTo(0,0);
  $$(".seg button").forEach(function(b){b.onclick=function(){sel=+b.dataset.i;home()}});
  $("#hb").onclick=history;
  var go=$("#go");if(go)go.onclick=function(){if(cur&&cur.day===sel)work();else start(sel)};
  var so=$("#so");if(so)so.onclick=function(){start(sel)};
}
function start(day){
  stop();var d=DAYS[day];
  cur={day:day,idx:0,t0:Date.now(),sets:d.ex.map(function(e){return e.sets.map(function(){return 0})}),w:d.ex.map(function(e){return lastW(e.en)||0})};
  save();work();
}

/* ---------- WORKOUT ---------- */
function work(){
  document.body.classList.add("wk");wake(true);
  var d=DAYS[cur.day],k=cur.idx,e=d.ex[k],n=d.ex.length,y=yid(e.link),v,lw=lastW(e.en),dn=isDone(k);
  if(y)v='<iframe src="https://www.youtube.com/embed/'+y+'?playsinline=1&rel=0&loop=1&playlist='+y+'&modestbranding=1&iv_load_policy=3" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="'+e.en+'"></iframe>';
  else if(/\.mp4(\?|$)/i.test(e.link||''))v='<video src="'+e.link+'" autoplay muted loop playsinline controls'+(e.img?' poster="'+e.img+'"':'')+'></video>';
  else v='<div class="none">'+I.play+'Video coming soon</div>';
  var h='<div class="wt"><button class="ib" id="cl" aria-label="Close">'+I.x+'</button><div class="wtt"><b>'+d.title+'</b><small>Exercise '+(k+1)+' of '+n+'</small></div></div>';
  h+='<div class="sgs">'+d.ex.map(function(_,j){return '<i class="sg'+(isDone(j)?' on':(j===k?' now':''))+'"></i>'}).join("")+'</div>';
  var s=e.sets.map(function(r,i){return '<button class="set'+(cur.sets[k][i]===1?' on':'')+'" data-n="'+i+'"><small>Set '+(i+1)+'</small><b>'+r+'</b></button>'}).join("");
  h+='<section class="ex'+(dn?' done':'')+(dir?(dir>0?' inR':' inL'):'')+'"><div class="hd"><div class="num">'+(dn?'✓':(k+1))+'</div><div class="nm"><h3>'+e.en+'</h3><div class="sec"><span>'+e.ku+'</span><span>'+e.ar+'</span></div></div></div>'
   +'<div class="frame"><div class="vid"'+(e.img?' style="background-image:url('+e.img+')"':'')+'>'+v+'</div></div>'+(e.tip?'<div class="tip">'+I.bulb+'<span dir="rtl">'+e.tip+'</span></div>':'')
   +'<div class="lbl">Sets · tap when done</div><div class="sets">'+s+'</div>'
   +'<div class="lbl">Weight &amp; rest'+(lw?' · last time '+lw+' kg':'')+' <span class="prb" id="pr" hidden>★ New record</span></div><div class="row"><div class="step"><button data-a="-1" aria-label="Subtract">'+I.minus+'</button><label><input type="number" inputmode="decimal" placeholder="0" value="'+(cur.w[k]||"")+'"><em>kg</em></label><button data-a="1" aria-label="Add">'+I.plus+'</button></div>'
   +'<div class="rest"><button data-r="'+cfg.r1+'" aria-label="Rest">'+I.timer+'<span>'+cfg.r1+'</span><small>sec</small></button><button data-r="'+cfg.r2+'" aria-label="Rest">'+I.timer+'<span>'+cfg.r2+'</span><small>sec</small></button></div></div></section>';
  h+='<div class="bar"><div class="barin"><button class="b2" id="pv" aria-label="Previous"'+(k?'':' disabled')+'>'+I.left+'</button><button class="b1" id="nx">'+(k<n-1?'Next exercise'+I.right:'Finish workout'+I.check)+'</button></div></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  var sec=$(".ex"),inp=$("input");
  $$(".set").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.n;cur.sets[k][i]=cur.sets[k][i]===1?0:1;save();buzz(20);
    b.classList.toggle("on",cur.sets[k][i]===1);
    var all=isDone(k);sec.classList.toggle("done",all);$(".num").textContent=all?"✓":(k+1);
    $$(".sg")[k].className="sg"+(all?" on":" now");
    if(cur.sets[k][i]===1&&!all&&cfg.auto)rest(cfg.ar)}});
  var bst=best(e.en);function chk(){var v=parseFloat(inp.value)||0;$("#pr").hidden=!(bst>0&&v>bst)}
  inp.onchange=function(){cur.w[k]=parseFloat(inp.value)||0;save();chk()};chk();
  $$("[data-a]").forEach(function(b){b.onclick=function(){
    var base=parseFloat(inp.value);if(isNaN(base))base=lw||0;
    var nv=Math.max(0,base+ +b.dataset.a*2.5);inp.value=nv;cur.w[k]=nv;save();chk()}});
  $$("[data-r]").forEach(function(b){b.onclick=function(){rest(+b.dataset.r)}});
  $("#cl").onclick=home;
  $("#pv").onclick=function(){if(cur.idx>0){cur.idx--;save();dir=-1;work()}};
  $("#nx").onclick=function(){if(k<n-1){cur.idx++;save();dir=1;work()}else finish()};
  dir=0;
}
function finish(){
  var d=DAYS[cur.day],mins=Math.max(1,Math.round((Date.now()-cur.t0)/60000)),vol=0,sets=0,exd=0,exs=[],prs=[];
  d.ex.forEach(function(e,j){
    var done=cur.sets[j].map(function(x,i){return x===1?e.sets[i]:0}),c=done.filter(Boolean).length;
    if(c){exd++;sets+=c;done.forEach(function(r){vol+=r*(cur.w[j]||0)})}
    exs.push({n:e.en,w:cur.w[j]||0,r:done});var bp=best(e.en);if(c&&cur.w[j]>0&&bp>0&&cur.w[j]>bp)prs.push(e.en+' · '+cur.w[j]+' kg')});
  if(sets>0){var h=jget("g:hist",[]);h.push({t:Date.now(),day:cur.day,title:d.title,dur:mins,vol:vol,sets:sets,ex:exs});jset("g:hist",h)}
  var total=d.ex.length;cur=null;save();stop();wake(false);document.body.classList.remove("wk");
  app.innerHTML='<div class="fin"><div class="chk">'+I.check+'</div><h2>Workout complete</h2><p class="tag">'+d.title+'</p>'
   +'<div class="stats"><div class="st"><b>'+mins+' min</b><span>Time</span></div><div class="st"><b>'+exd+' / '+total+'</b><span>Exercises</span></div><div class="st"><b>'+sets+'</b><span>Sets done</span></div><div class="st"><b>'+(vol?Math.round(vol).toLocaleString("en-US")+' kg':'—')+'</b><span>Total volume</span></div></div>'
   +(prs.length?'<div class="prl"><b>★ New records</b>'+prs.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>':'')+'<div class="cta"><div class="cin"><button class="b1" id="dn">Done</button><button class="lk" id="vh">View history</button></div></div></div>';
  window.scrollTo(0,0);$("#dn").onclick=home;$("#vh").onclick=history;
}

/* ---------- HISTORY ---------- */
function spark(a){
  var w=110,h=34,mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),r=mx-mn||1,lx=0,ly=0;
  var pts=a.map(function(v,i){var x=a.length>1?3+i*(w-6)/(a.length-1):w/2,y=h-4-(v-mn)/r*(h-8);lx=x;ly=y;return x.toFixed(1)+","+y.toFixed(1)});
  return '<svg class="sp" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts.join(" ")+'"/><circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="3.5"/></svg>';
}
function history(){more("h")}
function more(tab){
  stop();wake(false);document.body.classList.remove("wk");clr=false;
  var h='<div class="wt"><button class="ib" id="bk" aria-label="Back">'+I.left+'</button><div class="wtt"><b style="font-size:1.4rem">'+(tab==="h"?"History":"Settings")+'</b></div></div>';
  h+='<div class="seg" style="grid-template-columns:1fr 1fr;margin-bottom:6px"><button data-t="h" aria-selected="'+(tab==="h")+'">History</button><button data-t="s" aria-selected="'+(tab==="s")+'">Settings</button></div>';
  h+=tab==="h"?histHtml():setHtml();
  app.innerHTML=h;window.scrollTo(0,0);
  $("#bk").onclick=home;$$(".seg button").forEach(function(b){b.onclick=function(){more(b.dataset.t)}});
  if(tab==="h"){var cx=$("#cx");if(cx)cx.onclick=function(){if(!clr){clr=true;cx.textContent="Tap again to delete all history";return}jdel("g:hist");more("h")}}
  else bindSet();
}
function histHtml(){
  var hs=jget("g:hist",[]),by={},order=[],h="";
  hs.forEach(function(s){s.ex.forEach(function(e){if(e.w>0){if(!by[e.n]){by[e.n]=[];order.push(e.n)}by[e.n].push(e.w)}})});
  if(!hs.length)return '<div class="empty">'+I.hist+'No workouts yet.<br>Finish your first workout to see it here.</div>';
  if(order.length){h+='<div class="sec2">Weight progress</div>';
    order.forEach(function(n){var a=by[n],last=a[a.length-1],dl=last-a[0];h+='<div class="pg"><div class="pgi"><b>'+n+'</b><small>'+last+' kg'+(a.length>1?' · '+(dl>0?'+':'')+dl+' kg since first':'')+'</small></div>'+(a.length>1?spark(a):'')+'</div>'})}
  h+='<div class="sec2">Workouts</div>'+hs.slice().reverse().map(function(s){return '<div class="li hs"><div><b>'+s.title+'</b><small>'+fdate(s.t)+' · '+s.sets+' sets · '+s.dur+' min'+(s.vol?' · '+Math.round(s.vol).toLocaleString("en-US")+' kg':'')+'</small></div><span class="dd">Day '+(s.day+1)+'</span></div>'}).join("");
  return h+'<button class="lk" id="cx">Clear history</button>';
}
function setHtml(){
  function tg(k,l){return '<div class="rw"><span>'+l+'</span><button class="tg'+(cfg[k]?' on':'')+'" data-k="'+k+'">'+(cfg[k]?'On':'Off')+'</button></div>'}
  function nm(k,l){return '<div class="rw"><span>'+l+'</span><div class="mini"><button data-n="'+k+'" data-d="-15">'+I.minus+'</button><b>'+cfg[k]+'s</b><button data-n="'+k+'" data-d="15">'+I.plus+'</button></div></div>'}
  return '<div class="sec2">Rest timer</div>'+tg('auto','Start rest after each set')+nm('ar','Auto rest length')+nm('r1','Quick button 1')+nm('r2','Quick button 2')+tg('snd','Sound when rest ends')
   +'<div class="sec2">Appearance</div><div class="rw"><span>Theme</span><div class="mini">'+['auto','dark','light'].map(function(t){return '<button class="tg'+(cfg.theme===t?' on':'')+'" data-th="'+t+'">'+t[0].toUpperCase()+t.slice(1)+'</button>'}).join('')+'</div></div><div class="sec2">Screen</div>'+tg('wake','Keep screen on during workout')
   +'<div class="sec2">Backup</div><p class="tag" style="margin:0 2px 10px">Your history lives in this browser only. Export it to keep a copy.</p><div class="row"><button class="b3" id="ex">Export</button><button class="b3" id="im">Import</button></div><textarea id="bx" class="bx" placeholder="Backup text appears here. To import, paste it here and tap Import again." hidden></textarea><p class="tag" id="bm" style="margin:8px 2px"></p>';
}
function bindSet(){
  $$("[data-th]").forEach(function(b){b.onclick=function(){cfg.theme=b.dataset.th;jset('g:cfg',cfg);theme();more('s')}});
  $$(".tg[data-k]").forEach(function(b){b.onclick=function(){cfg[b.dataset.k]=cfg[b.dataset.k]?0:1;jset("g:cfg",cfg);more("s")}});
  $$("[data-n]").forEach(function(b){b.onclick=function(){var k=b.dataset.n;cfg[k]=Math.min(300,Math.max(15,cfg[k]+ +b.dataset.d));jset("g:cfg",cfg);more("s")}});
  var bx=$("#bx"),bm=$("#bm");
  $("#ex").onclick=function(){var t=JSON.stringify({v:1,hist:jget("g:hist",[]),cfg:cfg});bx.hidden=false;bx.value=t;bx.select();
    try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download="gym-backup.json";a.click()}catch(e){}
    try{navigator.clipboard.writeText(t).catch(function(){})}catch(e){}bm.textContent="Backup ready. Saved as a file or copy the text above."};
  $("#im").onclick=function(){if(bx.hidden){bx.hidden=false;bx.value="";bm.textContent="Paste your backup text, then tap Import again.";return}
    try{var o=JSON.parse(bx.value);if(!o||!Array.isArray(o.hist))throw 1;jset("g:hist",o.hist);if(o.cfg){for(var k in o.cfg)cfg[k]=o.cfg[k];jset("g:cfg",cfg)}bm.textContent="Imported "+o.hist.length+" workouts."}catch(e){bm.textContent="That text is not a valid backup."}};
}
sel=nextDay();home();
</script>
</body>
</html>
