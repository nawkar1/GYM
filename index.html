:root{--bg:#07080b;--s1:#101218;--s2:#171a22;--s3:#1f232d;--line:rgba(255,255,255,.08);--tx:#f4f6fa;--t2:#c3c8d4;--mute:#838a99;--ac:#7cc4ff;--ac2:#b4e3ff;--ok:#5fe3a1;
--f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fl:var(--f);--fk:'Rabar',Tahoma,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--tx);font-family:var(--f);line-height:1.6;background:radial-gradient(900px 420px at 50% -120px,rgba(124,196,255,.16),transparent 70%),var(--bg);min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px 16px 130px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;transition:transform .12s,background .2s,border-color .2s}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
svg{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{flex:none;width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--ac),var(--ac2));color:#06121f;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 8px 24px rgba(124,196,255,.3)}
h1{font-size:1.5rem;line-height:1.2;margin:0}
.tag{color:var(--mute);font-size:.82rem;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:20px;background:var(--s1);border:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg button{padding:9px 4px;border-radius:15px;color:var(--mute);font-size:1.02rem;line-height:1.25;font-weight:600}
.seg button small{display:block;font-size:.66rem;opacity:.9;font-weight:500}
.seg button[aria-selected="true"]{background:linear-gradient(145deg,var(--ac),var(--ac2));color:#06121f;box-shadow:0 6px 18px rgba(124,196,255,.28)}
.hero{margin:22px 2px 16px}
.hero h2{font-size:1.8rem;line-height:1.25;margin:0}
.hero p{color:var(--mute);font-size:.85rem;margin:2px 0 0}
.note{display:flex;gap:10px;align-items:center;font-size:.86rem;color:var(--t2);background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin:0 0 14px}
.note svg{flex:none;font-size:1.2rem;color:var(--ac)}
.ex{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:26px;padding:16px;margin-bottom:18px;transition:border-color .3s,box-shadow .3s}
.ex.done{border-color:rgba(95,227,161,.5);box-shadow:0 0 0 1px rgba(95,227,161,.15),0 12px 36px rgba(95,227,161,.08)}
.hd{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:52px;height:52px;border-radius:17px;background:var(--s3);color:var(--ac2);font-size:1.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line)}
.ex.done .num{background:var(--ok);color:#052214}
.nm{flex:1;min-width:0}
.nm h3{font-size:1.35rem;line-height:1.25;margin:2px 0 4px;font-weight:800;letter-spacing:-.01em}
.sec{display:flex;flex-wrap:wrap;gap:0 12px;font-size:.78rem;color:#667085}
.sec span{unicode-bidi:plaintext}
.sec span:first-child{font-family:var(--fk);font-size:.85rem}
.frame{width:204px;max-width:100%;margin:16px auto 0;padding:2.5px;border-radius:30px;background:linear-gradient(160deg,var(--ac),#a9c4ff 50%,#7a8cff);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 30px rgba(124,196,255,.22)}
.vid{position:relative;background:#000;aspect-ratio:9/16;border-radius:28px;overflow:hidden}
.vid iframe{width:100%;height:100%;border:0;display:block}
.cover{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(#000 70%,transparent)}
.none{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:#4b505c;font-size:.9rem}
.none svg{font-size:2.2rem}
.lbl{color:var(--mute);font-size:.76rem;margin:18px 2px 8px;font-weight:500}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.set{position:relative;padding:10px 4px 9px;border-radius:18px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.set small{display:block;font-size:.68rem;color:var(--mute);line-height:1.4}
.set b{display:block;font-size:1.6rem;line-height:1.15;font-weight:700}
.set.on{background:linear-gradient(145deg,var(--ok),#9af0c4);color:#052214;box-shadow:none}
.set.on small{color:#0b5a35}
.set.on::after{content:"";position:absolute;top:7px;right:8px;width:7px;height:12px;border:solid #052214;border-width:0 2.5px 2.5px 0;transform:rotate(40deg) scale(.8)}
.row{display:flex;gap:10px;align-items:stretch}
.step{flex:1;display:flex;align-items:center;justify-content:space-between;border-radius:18px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line);padding:4px}
.step button{width:42px;height:42px;border-radius:14px;background:var(--s2);font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.step label{flex:1;text-align:center;display:block}
.step input{width:100%;min-width:0;background:none;border:0;color:var(--tx);font-family:var(--f);font-size:1.4rem;font-weight:700;text-align:center;padding:0;line-height:1.1}
.step input::placeholder{color:#4b505c}
.step em{display:block;font-style:normal;font-size:.66rem;color:var(--mute)}
.rest{flex:none;display:flex;gap:8px}
.rest button{width:62px;border-radius:18px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:1.25rem;padding:6px 0}
.rest button span{font-size:1.05rem;line-height:1;font-weight:700}
.rest button small{font-size:.62rem;color:var(--mute)}
.empty{text-align:center;padding:70px 10px;color:var(--mute)}
.empty svg{font-size:3rem;margin:0 auto 12px;stroke:#3a404d}
.timer{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);display:flex;align-items:center;gap:14px;padding:10px 12px 10px 20px;border-radius:99px;background:rgba(23,26,34,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(124,196,255,.4);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);z-index:20}
.timer.show{transform:translate(-50%,0)}
.timer b{font-size:1.9rem;min-width:56px;text-align:center;line-height:1;color:var(--ac2);font-weight:700}
.timer span{font-size:.8rem;color:var(--mute)}
.timer button{width:40px;height:40px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
h1,h2,h3{font-weight:800;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ib{width:44px;height:44px;border-radius:15px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex:none}
.top .tt{flex:1;min-width:0}
.li{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px}
.li>div:not(.ln){flex:1;min-width:0}
.ln{flex:none;width:34px;height:34px;border-radius:11px;background:var(--s3);color:var(--ac2);display:flex;align-items:center;justify-content:center;font-weight:700}
.li b{display:block;font-size:.98rem;line-height:1.3;font-weight:600}
.li small{color:var(--mute);font-size:.78rem}
.dd{flex:none;font-size:.75rem;color:var(--ac2);background:var(--s3);border-radius:99px;padding:3px 10px}
.cta,.bar{position:fixed;left:0;right:0;bottom:0;padding:34px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 42%);z-index:15}
.cin,.barin{max-width:480px;margin:0 auto}
.barin{display:flex;gap:10px}
.b1{width:100%;height:58px;border-radius:20px;background:linear-gradient(145deg,var(--ac),var(--ac2));color:#06121f;font-size:1.08rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(124,196,255,.3)}
.b1 svg{font-size:1.2rem}
.b2{flex:none;width:58px;height:58px;border-radius:20px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.b2:disabled{opacity:.35}
.lk{display:block;margin:12px auto 0;color:var(--mute);font-size:.82rem;text-decoration:underline;padding:6px}
.wt{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wtt{flex:1}.wtt b{display:block;font-size:1rem;font-weight:700}.wtt small{color:var(--mute);font-size:.8rem}
.sgs{display:flex;gap:5px;margin-bottom:16px}
.sg{flex:1;height:5px;border-radius:9px;background:var(--s3)}
.sg.on{background:var(--ok)}.sg.now{background:var(--ac)}
.wk .timer{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px 0}
.st{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left}
.st b{display:block;font-size:1.5rem;line-height:1.3}.st span{color:var(--mute);font-size:.8rem}
.fin{text-align:center;padding-top:40px}
.chk{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(145deg,var(--ok),#a6f2cb);color:#052214;display:flex;align-items:center;justify-content:center;font-size:3rem;box-shadow:0 14px 40px rgba(95,227,161,.3);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.sec2{font-size:1.1rem;font-weight:700;margin:22px 2px 10px}
.pg{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px}
.pgi{flex:1;min-width:0}.pgi b{display:block;font-size:.95rem;font-weight:600;line-height:1.3}.pgi small{color:var(--mute);font-size:.78rem}
.sp{width:110px;height:34px;flex:none;stroke:var(--ac);stroke-width:2}
.sp circle{fill:var(--ac2);stroke:none}
.empty svg{font-size:3rem}
</style>
</head>
<body>
<main id="app"></main>
<div class="timer" id="tm" role="timer"><span>Rest</span><b id="tn">60</b><button id="tx" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<script>
// To add a video: put the YouTube link in the link field
var DAYS=[
{title:"Chest &amp; Triceps",warm:"10 min warm-up · 10 min cardio after",ex:[
{ku:"پرێسی سنگی سەرەوە بە بار",ar:"بنش برس علوي بالبار",en:"Incline Barbell Bench Press",sets:[12,10,8],link:"https://youtube.com/shorts/jkdLhMh5TZk"},
{ku:"پرێسی سنگی ئاسایی هەمەر",ar:"بنش برس عادي همر",en:"Flat Hammer Chest Press",sets:[12,10,8],link:"https://youtube.com/shorts/MAWqFJAfvqk"},
{ku:"پەپوولە (پێک دێک)",ar:"فتح فراشة",en:"Butterfly Machine (Pec Deck)",sets:[12,12,12],link:"https://youtube.com/shorts/E42VWsy1wvM"},
{ku:"پرێسی خوارەوە بە بار",ar:"بنش برس سفلي بالبار",en:"Decline Barbell Bench Press",sets:[12,10,8],link:"https://youtube.com/shorts/cRoyi7hm0SY"},
{ku:"سێ‌سەر بە دەمبڵ لە پشتی سەر",ar:"ترايسبس دمبل خلف الرأس جالس",en:"Seated Overhead Dumbbell Triceps Extension",sets:[12,12,12],link:"https://youtube.com/shorts/ScpmrhDvHgs"},
{ku:"سێ‌سەر کەیبڵ بە یەک دەست",ar:"ترايسبس كيبل بذراع واحدة",en:"Single Arm Cable Triceps Pushdown",sets:[12,12,12],link:"https://youtube.com/shorts/rVsQy0Q15Wc"},
{ku:"سێ‌سەر پووش‌داون بە کەیبڵ",ar:"ترايسبس بوش داون كيبل",en:"Cable Triceps Pushdown",sets:[12,12,12],link:"https://youtube.com/shorts/zK3av29F6ek"},
{ku:"کرانچی بایسکل",ar:"بايسكل كرنش",en:"Bicycle Crunch",sets:[15,15,15],link:"https://youtube.com/shorts/1vysvmaLWkg?feature=share"}
]},
{title:"",warm:"",ex:[]},
{title:"",warm:"",ex:[]}
];
var I={
 play:'<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',
 timer:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 10v3.5l2 1.5M9.5 3h5"/></svg>',
 minus:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 fire:'<svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 .2 1.2.8 2 1.6 2.2C10 8 11 5.5 12 3z"/></svg>',
 dumb:'<svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
 hist:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8 8 8 0 00-6 2.7M4 4v3.5h3.5M12 8v4.5l3 1.5"/></svg>',
 left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
var app=document.getElementById("app"),tm=document.getElementById("tm"),tn=document.getElementById("tn"),timer=null,sel=0,clr=false;
function jget(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function jdel(k){try{localStorage.removeItem(k)}catch(e){}}
var cur=jget("g:cur",null);
if(cur&&!DAYS[cur.day])cur=null;
function save(){if(cur)jset("g:cur",cur);else jdel("g:cur")}
function yid(u){var m=u&&u.match(/(?:shorts\/|youtu\.be\/|v=|embed\/)([\w-]{11})/);return m?m[1]:null}
function reps(e){var a=e.sets;return a.every(function(x){return x===a[0]})?a.length+" × "+a[0]:a.join(" - ")}
function buzz(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function lastW(name){var h=jget("g:hist",[]);for(var i=h.length-1;i>=0;i--){var e=h[i].ex.filter(function(x){return x.n===name&&x.w>0})[0];if(e)return e.w}return null}
function fdate(t){return new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function isDone(j){return cur.sets[j].every(function(x){return x===1})}
function stop(){if(timer){clearInterval(timer);timer=null}tm.classList.remove("show")}
function rest(sec){
  stop();var left=sec;tn.textContent=left;tm.classList.add("show");
  timer=setInterval(function(){left--;tn.textContent=Math.max(left,0);if(left<=0){stop();buzz([300,120,300])}},1000);
}
document.getElementById("tx").onclick=stop;
function $(s,r){return (r||app).querySelector(s)}
function $$(s,r){return [].slice.call((r||app).querySelectorAll(s))}

/* ---------- HOME ---------- */
function home(){
  stop();document.body.classList.remove("wk");
  var d=DAYS[sel],h='<div class="top"><div class="logo">'+I.dumb+'</div><div class="tt"><h1>Workout Plan</h1><p class="tag">Pick a day, then start</p></div><button class="ib" id="hb" aria-label="History">'+I.hist+'</button></div>';
  h+='<div class="seg" role="tablist">'+DAYS.map(function(x,i){return '<button role="tab" data-i="'+i+'" aria-selected="'+(i===sel)+'">Day '+(i+1)+(x.title?'<small>'+x.title+'</small>':'')+'</button>'}).join("")+'</div>';
  if(!d.ex.length){h+='<div class="empty">'+I.dumb+'Day '+(sel+1)+' is not added yet</div>'}
  else{
    var res=cur&&cur.day===sel;
    h+='<div class="hero"><h2>'+d.title+'</h2><p>'+d.ex.length+' exercises · about '+Math.round(d.ex.length*5.5)+' min</p></div>';
    if(d.warm)h+='<div class="note">'+I.fire+'<span>'+d.warm+'</span></div>';
    h+=d.ex.map(function(e,k){return '<div class="li"><span class="ln">'+(k+1)+'</span><div><b>'+e.en+'</b><small>'+reps(e)+'</small></div></div>'}).join("");
    h+='<div class="cta"><div class="cin"><button class="b1" id="go">'+(res?'Resume · exercise '+(cur.idx+1)+' of '+d.ex.length:'Start Workout')+I.play+'</button>'+(res?'<button class="lk" id="so">Start over</button>':'')+'</div></div>';
  }
  app.innerHTML=h;window.scrollTo(0,0);
  $$(".seg button").forEach(function(b){b.onclick=function(){sel=+b.dataset.i;home()}});
  $("#hb").onclick=history;
  var go=$("#go");if(go)go.onclick=function(){if(cur&&cur.day===sel)work();else start(sel)};
  var so=$("#so");if(so)so.onclick=function(){start(sel)};
}
function start(day){
  var d=DAYS[day];
  cur={day:day,idx:0,t0:Date.now(),sets:d.ex.map(function(e){return e.sets.map(function(){return 0})}),w:d.ex.map(function(e){return lastW(e.en)||0})};
  save();work();
}

/* ---------- WORKOUT ---------- */
function work(){
  document.body.classList.add("wk");stop();
  var d=DAYS[cur.day],k=cur.idx,e=d.ex[k],n=d.ex.length,y=yid(e.link),v,lw=lastW(e.en),dn=isDone(k);
  if(y)v='<iframe src="https://www.youtube.com/embed/'+y+'?playsinline=1&rel=0&loop=1&playlist='+y+'&modestbranding=1&iv_load_policy=3" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="'+e.en+'"></iframe><div class="cover"></div>';
  else v='<div class="none">'+I.play+'Video coming soon</div>';
  var h='<div class="wt"><button class="ib" id="cl" aria-label="Close">'+I.x+'</button><div class="wtt"><b>'+d.title+'</b><small>Exercise '+(k+1)+' of '+n+'</small></div></div>';
  h+='<div class="sgs">'+d.ex.map(function(_,j){return '<i class="sg'+(isDone(j)?' on':(j===k?' now':''))+'"></i>'}).join("")+'</div>';
  var s=e.sets.map(function(r,i){return '<button class="set'+(cur.sets[k][i]===1?' on':'')+'" data-n="'+i+'"><small>Set '+(i+1)+'</small><b>'+r+'</b></button>'}).join("");
  h+='<section class="ex'+(dn?' done':'')+'"><div class="hd"><div class="num">'+(dn?'✓':(k+1))+'</div><div class="nm"><h3>'+e.en+'</h3><div class="sec"><span>'+e.ku+'</span><span>'+e.ar+'</span></div></div></div>'
   +'<div class="frame"><div class="vid">'+v+'</div></div>'
   +'<div class="lbl">Sets · tap when done</div><div class="sets">'+s+'</div>'
   +'<div class="lbl">Weight &amp; rest'+(lw?' · last time '+lw+' kg':'')+'</div><div class="row"><div class="step"><button data-a="-1" aria-label="Subtract">'+I.minus+'</button><label><input type="number" inputmode="decimal" placeholder="0" value="'+(cur.w[k]||"")+'"><em>kg</em></label><button data-a="1" aria-label="Add">'+I.plus+'</button></div>'
   +'<div class="rest"><button data-r="60" aria-label="Rest 60 seconds">'+I.timer+'<span>60</span><small>sec</small></button><button data-r="90" aria-label="Rest 90 seconds">'+I.timer+'<span>90</span><small>sec</small></button></div></div></section>';
  h+='<div class="bar"><div class="barin"><button class="b2" id="pv" aria-label="Previous"'+(k?'':' disabled')+'>'+I.left+'</button><button class="b1" id="nx">'+(k<n-1?'Next exercise'+I.right:'Finish workout'+I.check)+'</button></div></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  var sec=$(".ex"),inp=$("input");
  $$(".set").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.n;cur.sets[k][i]=cur.sets[k][i]===1?0:1;save();buzz(20);
    b.classList.toggle("on",cur.sets[k][i]===1);
    var all=isDone(k);sec.classList.toggle("done",all);$(".num").textContent=all?"✓":(k+1);
    $$(".sg")[k].className="sg"+(all?" on":" now");
    if(cur.sets[k][i]===1&&!all)rest(60)}});
  inp.onchange=function(){cur.w[k]=parseFloat(inp.value)||0;save()};
  $$("[data-a]").forEach(function(b){b.onclick=function(){
    var base=parseFloat(inp.value);if(isNaN(base))base=lw||0;
    var nv=Math.max(0,base+ +b.dataset.a*2.5);inp.value=nv;cur.w[k]=nv;save()}});
  $$("[data-r]").forEach(function(b){b.onclick=function(){rest(+b.dataset.r)}});
  $("#cl").onclick=home;
  $("#pv").onclick=function(){if(cur.idx>0){cur.idx--;save();work()}};
  $("#nx").onclick=function(){if(k<n-1){cur.idx++;save();work()}else finish()};
}
function finish(){
  var d=DAYS[cur.day],mins=Math.max(1,Math.round((Date.now()-cur.t0)/60000)),vol=0,sets=0,exd=0,exs=[];
  d.ex.forEach(function(e,j){
    var done=cur.sets[j].map(function(x,i){return x===1?e.sets[i]:0}),c=done.filter(Boolean).length;
    if(c){exd++;sets+=c;done.forEach(function(r){vol+=r*(cur.w[j]||0)})}
    exs.push({n:e.en,w:cur.w[j]||0,r:done})});
  if(sets>0){var h=jget("g:hist",[]);h.push({t:Date.now(),day:cur.day,title:d.title,dur:mins,vol:vol,sets:sets,ex:exs});jset("g:hist",h)}
  var total=d.ex.length;cur=null;save();stop();document.body.classList.remove("wk");
  app.innerHTML='<div class="fin"><div class="chk">'+I.check+'</div><h2>Workout complete</h2><p class="tag">'+d.title+'</p>'
   +'<div class="stats"><div class="st"><b>'+mins+' min</b><span>Time</span></div><div class="st"><b>'+exd+' / '+total+'</b><span>Exercises</span></div><div class="st"><b>'+sets+'</b><span>Sets done</span></div><div class="st"><b>'+(vol?Math.round(vol).toLocaleString("en-US")+' kg':'—')+'</b><span>Total volume</span></div></div>'
   +'<div class="cta"><div class="cin"><button class="b1" id="dn">Done</button><button class="lk" id="vh">View history</button></div></div></div>';
  window.scrollTo(0,0);$("#dn").onclick=home;$("#vh").onclick=history;
}

/* ---------- HISTORY ---------- */
function spark(a){
  var w=110,h=34,mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),r=mx-mn||1,lx=0,ly=0;
  var pts=a.map(function(v,i){var x=a.length>1?3+i*(w-6)/(a.length-1):w/2,y=h-4-(v-mn)/r*(h-8);lx=x;ly=y;return x.toFixed(1)+","+y.toFixed(1)});
  return '<svg class="sp" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts.join(" ")+'"/><circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="3.5"/></svg>';
}
function history(){
  stop();document.body.classList.remove("wk");clr=false;
  var hs=jget("g:hist",[]),by={},order=[];
  hs.forEach(function(s){s.ex.forEach(function(e){if(e.w>0){if(!by[e.n]){by[e.n]=[];order.push(e.n)}by[e.n].push(e.w)}})});
  var h='<div class="wt"><button class="ib" id="bk" aria-label="Back">'+I.left+'</button><div class="wtt"><b style="font-size:1.4rem">History</b><small>'+hs.length+' workouts logged</small></div></div>';
  if(!hs.length)h+='<div class="empty">'+I.hist+'No workouts yet.<br>Finish your first workout to see it here.</div>';
  else{
    if(order.length){
      h+='<div class="sec2">Weight progress</div>';
      order.forEach(function(n){var a=by[n],last=a[a.length-1],dl=last-a[0];
        h+='<div class="pg"><div class="pgi"><b>'+n+'</b><small>'+last+' kg'+(a.length>1?' · '+(dl>0?'+':'')+dl+' kg since first':'')+'</small></div>'+(a.length>1?spark(a):'')+'</div>'});
    }
    h+='<div class="sec2">Workouts</div>';
    h+=hs.slice().reverse().map(function(s){return '<div class="li hs"><div><b>'+s.title+'</b><small>'+fdate(s.t)+' · '+s.sets+' sets · '+s.dur+' min'+(s.vol?' · '+Math.round(s.vol).toLocaleString("en-US")+' kg':'')+'</small></div><span class="dd">Day '+(s.day+1)+'</span></div>'}).join("");
    h+='<button class="lk" id="cx">Clear history</button>';
  }
  app.innerHTML=h;window.scrollTo(0,0);
  $("#bk").onclick=home;
  var cx=$("#cx");if(cx)cx.onclick=function(){if(!clr){clr=true;cx.textContent="Tap again to delete all history";return}jdel("g:hist");history()};
}
home();
</script>
</body>
</html>
